<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>WebRTC instrumentation</title>
<button id="start">Start audio test</button><script>
window.rtcResult={state:'ready'};
const close=()=>{window.testStream?.getTracks().forEach(t=>t.stop());window.left?.close();window.right?.close();};
window.addEventListener('growing-realtime-stop',close);window.addEventListener('pagehide',close);
async function gather(pc){if(pc.iceGatheringState==='complete')return;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('ICE timeout')),12000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timer);resolve();}});});}
document.getElementById('start').onclick=async()=>{
  try{
    rtcResult.state='capturing';
    window.testStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    window.left=new RTCPeerConnection({iceServers:[]});window.right=new RTCPeerConnection({iceServers:[]});
    right.ontrack=()=>rtcResult.remoteTrack=true;
    left.addTrack(testStream.getAudioTracks()[0],testStream);
    await left.setLocalDescription(await left.createOffer());await gather(left);
    await right.setRemoteDescription(left.localDescription);await right.setLocalDescription(await right.createAnswer());await gather(right);await left.setRemoteDescription(right.localDescription);
    const deadline=Date.now()+15000;
    while(Date.now()<deadline){
      const stats=await right.getStats();stats.forEach(s=>{if(s.type==='inbound-rtp'&&(s.kind==='audio'||s.mediaType==='audio')&&s.packetsReceived>0)rtcResult.packetsReceived=s.packetsReceived;});
      if(rtcResult.packetsReceived){rtcResult.state='passed';return;}
      await new Promise(r=>setTimeout(r,150));
    }
    throw Error('No audio RTP packets');
  }catch(error){close();rtcResult={state:'failed',error:error.name+': '+error.message};}
};
</script></html>
