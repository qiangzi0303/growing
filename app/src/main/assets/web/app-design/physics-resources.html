const renderLegacy=()=>{
const params=new URLSearchParams(location.search),unit=params.get('unit'),term=params.get('term')==='lower'?'lower':'upper';

 try{if(window.top.GrowingCloud?.openPapers)await window.top.GrowingCloud.openPapers({subject:'physics'});
 else if(window.GrowingNative)location.href='../cloud/index.html?subject=physics&return='+encodeURIComponent(location.href)+'#my-papers';
 else location.href='/?subject=physics#my-papers';}
 catch(error){document.getElementById('paper-entry-status').textContent='试卷暂时无法打开：'+error.message;}
});
};if(!window.GrowingStudentPages?.registerLegacy(renderLegacy))renderLegacy();
