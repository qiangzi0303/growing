\)、\\(F\\)，\\(AB=6\\)，\\(AC=3\\)，则 \\(BE=\\) ______。", "format": "math-text-v1", "sourceId": "midterm-20261029", "sourceLabel": "文景实验学校八年级上数学期中复习卷（1）", "note": "", "review": "仅收录考查知识点；未凭照片认定本题做错。", "priority": false, "figure": "math-midterm-figures/q14.svg"}, {"id": "midterm-20261029-15", "number": 15, "page": 2, "unitId": "math-8a-01", "unitIds": ["math-8a-01"], "title": "格点中的直角三角形计数", "concepts": ["right-triangle", "grid-count"], "text": "如图为一张藏宝图，有一人想出发寻宝，已知秘密宝藏藏在图中的某个黑点标示的位置，经过调查，秘密宝藏的位置 \\(P\\) 满足条件：\\(\\triangle PAB\\) 为直角三角形，符合条件的 \\(P\\) 点的个数为 ______ 个。", "format": "math-text-v1", "sourceId": "midterm-20261029", "sourceLabel": "文景实验学校八年级上数学期中复习卷（1）", "note": "", "review": "仅收录考查知识点；未凭照片认定本题做错。", "priority": false, "figure": "math-midterm-figures/q15.svg"}, {"id": "midterm-20261029-16", "number": 16, "page": 2, "unitId": "math-8b-09", "unitIds": ["math-8b-09", "math-8a-02"], "title": "因式分解与实数混合运算", "concepts": ["factor-common", "difference-square", "perfect-square", "real-power"], "text": "（9分）分解因式：\n（1）\\(2x^2-8\\)；\n（2）\\(x^3y-2x^2y^2+xy^3\\)。\n（3）计算：\\(\\sqrt{4}+(2023-\\sqrt{3})^0-\\left(\\frac{1}{3}\\right)^{-1}\\)。", "format": "math-text-v1", "sourceId": "midterm-20261029", "sourceLabel": "文景实验学校八年级上数学期中复习卷（1）", "note": "", "review": "仅收录考查知识点；未凭照片认定本题做错。", "priority": false, "figure": null}, {"id": "midterm-20261029-17", "number": 17, "page": 2, "unitId": "math-8b-10", "unitIds": ["math-8b-10"], "title": "分式加减与乘除混合运算", "concepts": ["add", "multiply", "reduce"], "text": "（6分）计算：\n（1）\\(\\frac{2m+1}{m-1}+\\frac{m-4}{m-1}\\)；\n（2）\\(\\frac{y^2}{x-y}\\cdot\\frac{2x-2y}{x}\\div\\frac{4y}{x}\\)。", "format": "math-text-v1", "sourceId": "midterm-20261029", "sourceLabel": "文景实验学校八年级上数学期中复习卷（1）", "note": "", "review": "第（2）问有错误及扣分痕迹；第（1）问不据此判错。", "priority": true, "figure": null}, {"id": "midterm-20261029-18", "number": 18, "page": 2, "unitId": "math-8b-10", "unitIds": ["math-8b-10"], "title": "分式化简求值与取值限制", "concepts": ["add", "multiply", "reduce", "meaning"], "text": "（6分）先化简：\\(\\left(\\frac{x-1}{x+1}+\\frac{2x}{x^2-1}\\right)\\div\\frac{1}{x^2-1}\\)，再从 \\(-1\\)、\\(0\\)、\\(1\\) 中选一个合适的 \\(x\\) 的值代入求值。", "format": "math-text-v1", "sourceId": "midterm-20261029", "sourceLabel": "文景实验学校八年级上数学期中复习卷（1）", "note": "", "review": "可见扣分痕迹；化简、取值与最终求值需重新独立核对。", "priority": true, "figure": null}, {"id": "midterm-20261029-20", "number": 20, "page": 2, "unitId": "math-8a-01", "unitIds": ["math-8a-01"], "title": "尺规作图与垂直平分线性质", "concepts": ["construction", "perp-bisector", "isosceles", "parallel-angles"], "text": "（6分）已知：如图，射线 \\(BA\\) 和射线 \\(BC\\) 有公共端点 \\(B\\)。\n（1）①作线段 \\(BC\\) 的垂直平分线，交射线 \\(BA\\) 于点 \\(P\\)；\n②过 \\(P\\) 作射线 \\(PD\\)，使 \\(PD\\parallel BC\\)。\n（以上按要求尺规作图，并保留作图痕迹。）\n（2）若 \\(\\angle APD=34^\\circ\\)，连接 \\(PC\\)，则 \\(\\angle BCP=\\) ______。", "format": "math-text-v1", "sourceId": "midterm-20261029", "sourceLabel": "文景实验学校八年级上数学期中复习卷（1）", "note": "", "review": "仅收录考查知识点；未凭照片认定本题做错。", "priority": false, "figure": "math-midterm-figures/q20.svg"}, {"id": "midterm-20261029-21", "number": 21, "page": 3, "unitId": "math-8b-10", "unitIds": ["math-8b-10"], "title": "等时搬运问题的分式方程建模", "concepts": ["equation", "word-problem", "extraneous"], "text": "（6分）人工智能在物流行业有广泛的应用，其中自主移动机器人可以实现高效的搬运和拣货作业。某物流园区利用 \\(A\\)、\\(B\\) 两种自主移动机器人搬运化工原料，\\(A\\) 型机器人比 \\(B\\) 型机器人每小时多搬运 \\(10\\,\\mathrm{kg}\\)，\\(A\\) 型机器人搬运 \\(800\\,\\mathrm{kg}\\) 所用时间与 \\(B\\) 型机器人搬运 \\(600\\,\\mathrm{kg}\\) 所用时间相等，两种机器人每小时分别搬运多少化工原料？", "format": "math-text-v1", "sourceId": "midterm-20261029", "sourceLabel": "文景实验学校八年级上数学期中复习卷（1）", "note": "", "review": "仅收录考查知识点；未凭照片认定本题做错。", "priority": false, "figure": null}, {"id": "midterm-20261029-22", "number": 22, "page": 3, "unitId": "math-8a-01", "unitIds": ["math-8a-01"], "title": "双角平分线交点求角与线段相等证明", "concepts": ["angle-bisector", "triangle-angles", "congruence"], "text": "（6分）如图，在 \\(\\triangle ABC\\) 中，\\(\\angle ABC=40^\\circ\\)，\\(\\angle ACB=80^\\circ\\)。点 \\(D\\)、\\(E\\) 分别在 \\(AC\\)、\\(AB\\) 上，\\(BD\\)、\\(CE\\) 分别是 \\(\
