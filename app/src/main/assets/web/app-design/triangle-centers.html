<style>
:root{
  --primary-gradient:linear-gradient(135deg,#F59E0B 0%,#EAB308 100%);
  --bg-gradient:linear-gradient(180deg,#0F172A 0%,#422006 50%,#713F12 100%);
  --accent-amber:#FBBF24;--accent-cyan:#22D3EE;--accent-emerald:#34D399;
  --accent-rose:#FB7185;--accent-orange:#FB923C;--accent-violet:#A78BFA;
  --glass-bg:rgba(255,255,255,0.08);--glass-border:rgba(255,255,255,0.15);
  --text-primary:#F8FAFC;--text-secondary:#CBD5E1;--text-muted:#94A3B8;
  --panel-bg:rgba(66,32,6,0.6);--panel-border:rgba(245,158,11,0.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-gradient);color:var(--text-primary)}
.glass{background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border)}
.btn{background:var(--primary-gradient);transition:all .2s ease;box-shadow:0 4px 14px rgba(245,158,11,.3)}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.08);transition:all .2s}
.btn-ghost:hover{background:rgba(255,255,255,.16)}
.center-item{transition:all .2s ease;border:1px solid transparent;cursor:pointer}
.center-item:hover{background:rgba(245,158,11,.15)}
.center-item.active{background:rgba(245,158,11,.28);border-color:var(--accent-amber)}
.vertex{cursor:grab}.vertex:active{cursor:grabbing}
input[type=range]{-webkit-appearance:none;height:5px;border-radius:5px;background:rgba(255,255,255,.2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#FBBF24,#FDE68A);cursor:pointer;box-shadow:0 0 8px rgba(251,191,36,.7)}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;transition:all .35s cubic-bezier(.2,.8,.3,1);z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.panel-slide{transition:all .3s ease}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:rgba(245,158,11,.4);border-radius:4px}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--accent-amber);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.chk.done{background:var(--accent-amber)}
svg text{user-select:none}
.sidebar-collapsed{transform:translateX(-100%)}
</style>
