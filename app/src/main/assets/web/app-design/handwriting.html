<body><main class="workspace">
  <header><nav class="writing-navigation"><a id="back">← 返回课堂</a></nav><p class="eyebrow">GROWING · 拍照作答</p><h1 id="page-title">拍照作业</h1><p id="course-label"></p><p id="writing-guide"></p></header>
  <div class="layout">
  <section class="editor panel">
    <section class="task-bank" aria-labelledby="task-heading"><h2 id="task-heading">本单元题目</h2><p id="bank-description" hidden></p><label for="task-choice">选择题目</label><div class="task-actions"><select id="task-choice"></select></div><p id="task-knowledge" class="muted"></p></section>

    <section class="review"><button id="grade" class="primary">AI批改</button><button id="photo-answer">拍照上传</button><input id="answer-photo" type="file" accept="image/*" capture="environment" hidden><button id="cancel" hidden>取消批改</button><p id="ai-status" role="status" aria-live="polite"></p><section id="upload-records"></section><div id="grades"></div></section>
  </section></div>
