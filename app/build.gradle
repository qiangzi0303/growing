plugins { id 'com.android.application' }

def releaseCode = (System.getenv('GROWING_VERSION_CODE') ?: '1').toInteger()
def releaseName = System.getenv('GROWING_VERSION_NAME') ?: '1.0.0'
def keyStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def updateSite = new groovy.json.JsonSlurper().parse(rootProject.file('update-site.json'))
def platformSite = new groovy.json.JsonSlurper().parse(rootProject.file('platform-site.json'))
def cloudApiUrl = (System.getenv('GROWING_CLOUD_URL') ?: platformSite.apiBaseUrl ?: '').trim().replaceAll('/+$', '')
if (cloudApiUrl) {
    def uri = new URI(cloudApiUrl)
    if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.fragment || uri.query || (uri.path && uri.path != '/')) {
        throw new GradleException('Cloud URL must be an HTTPS site origin, such as https://learn.example.com.')
    }
}
def updateManifestUrl = (System.getenv('GROWING_UPDATE_URL') ?: updateSite.manifestUrl ?: '').trim()
if (updateManifestUrl) {
    def uri = new URI(updateManifestUrl)
    if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.fragment) {
        throw new GradleException('Update manifest URL must be a public HTTPS URL without credentials or fragment.')
    }
}

android {
    namespace 'com.qiangzi0303.growing'
    compileSdk 35
    defaultConfig {
        // Never change: Android requires the same id and certificate for an update.
        applicationId 'com.qiangzi0303.growing'
        minSdk 26
        targetSdk 35
        versionCode releaseCode
        versionName releaseName
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', groovy.json.JsonOutput.toJson(updateManifestUrl)
        buildConfigField 'String', 'CLOUD_API_URL', groovy.json.JsonOutput.toJson(cloudApiUrl)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (keyStorePath) {
                storeFile file(keyStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testBuildType 'release'
}
tasks.matching { it.name == 'validateSigningRelease' }.configureEach {
    doFirst {
        if (!keyStorePath || !file(keyStorePath).isFile()) throw new GradleException('Fixed release keystore is required. Debug signing is forbidden for releases.')
        ['ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException('Missing release signing environment: ' + it)
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
