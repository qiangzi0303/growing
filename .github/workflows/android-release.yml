name: Android signed APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROWING_VERSION_CODE: ${{ github.run_number }}
      GROWING_VERSION_NAME: 1.0.${{ github.run_number }}
      # Use the versioned update-site.json; ignore stale repository overrides.
      GROWING_UPDATE_URL: ''
      # Use platform-site.json, matching the public download/update domain.
      GROWING_CLOUD_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK publishing configuration
        env:
          APK_PUBLISH_TOKEN: ${{ secrets.APK_PUBLISH_TOKEN }}
        run: test -n "$APK_PUBLISH_TOKEN" || { echo 'APK_PUBLISH_TOKEN is missing.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned math and Worker dependencies
        run: npm ci
        working-directory: cloudflare
      - name: Verify native speech adapter behavior
        run: node scripts/test-speech.cjs
      - name: Verify APK distribution protocol without network access
        run: python3 -B scripts/test_publish_apk.py
      - name: Sync shared platform interface
        run: python3 scripts/sync-platform.py
      - name: Verify cloud synchronization decisions
        run: node --test scripts/test-platform.cjs scripts/handwriting.test.cjs scripts/unit-summary.test.cjs scripts/math-format.test.cjs scripts/fraction-grading.test.cjs
      - name: Verify Android AI and storage adapter
        run: node scripts/test-ai.cjs
      - name: Verify Qwen account settings and signalling
        run: node --test scripts/realtime.test.cjs
      - name: Verify packaged rewards, curriculum and panorama rules
        run: node --test scripts/rewards.test.cjs scripts/year8.test.cjs scripts/panorama.test.cjs scripts/english.test.cjs scripts/physics.test.cjs scripts/course-tools.test.cjs scripts/course-ai.test.cjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Prepare fixed release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Fixed signing key is missing. Refusing to generate a replacement.'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/growing-release.jks"
          chmod 600 "$RUNNER_TEMP/growing-release.jks"
      - name: Verify assets contain no embedded credentials
        run: python3 scripts/verify-assets.py
      - name: Unit tests, lint and signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/growing-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleRelease assembleReleaseAndroidTest
      - name: Verify signature and archive APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/growing-${GROWING_VERSION_NAME}.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/signature.txt
          python3 scripts/verify-certificate.py dist/signature.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cp docs/release-identity.json dist/release-identity.json
          python3 scripts/create-update-manifest.py --apk "dist/growing-${GROWING_VERSION_NAME}.apk" --version-code "$GROWING_VERSION_CODE" --version-name "$GROWING_VERSION_NAME" --notes-file docs/release-notes.md --output dist/update.json
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify accounts, overwrite update and tablet rotation on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/growing-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash scripts/test-upgrade.sh
            bash scripts/test-tablet.sh
            adb shell pm revoke com.qiangzi0303.growing android.permission.RECORD_AUDIO
            adb shell am instrument -w -r -e class com.qiangzi0303.growing.RealtimeWebRtcTest com.qiangzi0303.growing.test/androidx.test.runner.AndroidJUnitRunner > test-results/realtime-webrtc.txt
            cat test-results/realtime-webrtc.txt
            grep -q 'OK (1 test)' test-results/realtime-webrtc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: growing-signed-apk-${{ github.run_number }}
          path: dist/
          retention-days: 90
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GROWING_VERSION_CODE}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "成长 ${GROWING_VERSION_NAME}" --notes-file docs/release-notes.md
      - name: Publish APK and update manifest to Cloudflare
        env:
          APK_PUBLISH_TOKEN: ${{ secrets.APK_PUBLISH_TOKEN }}
        run: python3 scripts/publish-apk.py --manifest dist/update.json
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/growing-release.jks"
